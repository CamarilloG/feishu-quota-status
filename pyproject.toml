[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lark-status"
version = "0.2.0"
description = "把一行字写进飞书状态栏：AI 额度、摸鱼计时、番茄钟、CI 状态"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lark-status = "lark_status.cli:main"

[tool.setuptools.packages.find]
include = ["lark_status*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
